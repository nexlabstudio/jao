name: jao_generator
description: Code generator for jao ORM. Generates typed field accessors and model metadata.
version: 0.0.1
homepage: https://github.com/example/jao

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  analyzer: ^6.0.0
  build: ^2.4.0
  source_gen: ^1.5.0
  jao:
    path: ../jao

dev_dependencies:
  build_runner: ^2.4.0
  build_test: ^2.2.0
  coverage: ^1.15.0
  test: ^1.24.0
  lints: ^3.0.0
