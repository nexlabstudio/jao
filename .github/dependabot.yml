version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Dart packages
  - package-ecosystem: "pub"
    directory: "/packages/jao"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pub"
    directory: "/packages/jao_cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pub"
    directory: "/packages/jao_generator"
    schedule:
      interval: "weekly"
